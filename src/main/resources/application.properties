# ===================================================================
# MediNear Application Properties
# ===================================================================
spring.application.name=medinear

# PORT is injected by Railway/Render. Falls back to 8080 locally.
server.port=${PORT:8080}

# ===================================================================
# Supabase PostgreSQL Database Configuration
# All secrets read from environment variables — never hardcode here.
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://db.xfsubnzzyspzycyyjjrq.supabase.co:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================================================
# Supabase Project Details
# ===================================================================
supabase.url=${SUPABASE_URL:https://xfsubnzzyspzycyyjjrq.supabase.co}
supabase.publish-key=${SUPABASE_PUBLISH_KEY}

# ===================================================================
# JPA / Hibernate Properties
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===================================================================
# JWT (JSON Web Token) Properties
# ===================================================================
medinear.jwt.secret=${JWT_SECRET}
medinear.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS — allowed frontend origins (comma-separated)
# Set ALLOWED_ORIGINS to your Vercel domain in Railway env vars.
# ===================================================================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
