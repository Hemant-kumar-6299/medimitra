# ===================================================================
# MediNear Application Properties
# ===================================================================
spring.application.name=medinear

# PORT is injected by Railway/Render. Falls back to 8080 locally.
server.port=${PORT:8080}
# Bind all interfaces so Railway's proxy can reach the app.
server.address=0.0.0.0

# ===================================================================
# Supabase PostgreSQL — use the IPv4 CONNECTION POOLER
# Direct host db.<ref>.supabase.co:5432 is IPv6-only and fails on Railway.
# Session pooler (port 5432) works with Hibernate/JPA.
# Username must be postgres.<project-ref> when using the pooler host.
# ===================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-ap-northeast-2.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.xfsubnzzyspzycyyjjrq}
spring.datasource.password=${DB_PASSWORD:@H3M9NTH3MU1705}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the pool small on Railway free/hobby memory limits; fail fast if DB is down.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=1

# ===================================================================
# Supabase Project Details
# ===================================================================
supabase.url=${SUPABASE_URL:https://xfsubnzzyspzycyyjjrq.supabase.co}
supabase.publish-key=${SUPABASE_PUBLISH_KEY:sb_publishable_ecVJt7TSsea8vvvA_2xEzw__ucFdxI8}

# ===================================================================
# JPA / Hibernate Properties
# ===================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===================================================================
# JWT (JSON Web Token) Properties
# ===================================================================
medinear.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
medinear.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ===================================================================
# CORS — allowed frontend origins (comma-separated)
# Set ALLOWED_ORIGINS to your Vercel domain in Railway env vars.
# ===================================================================
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
